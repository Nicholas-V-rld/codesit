    <rect x="80" y="0" width="72" height="72" fill="#14161F" fill-opacity="0.08" />
    <rect x="0" y="80" width="72" height="72" fill="#14161F" fill-opacity="0.08" />
    <rect x="80" y="80" width="72" height="72" fill="#14161F" fill-opacity="0.08" />
    <circle cx="36" cy="36" r="4" fill="#0D9488" fill-opacity="0.7" />
    <circle cx="116" cy="116" r="4" fill="#0D9488" fill-opacity="0.7" />
  </g>
